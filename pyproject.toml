[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-document-retrieval"
version = "0.1.0"
description = "A small document ingestion API for a retrieval engineering project."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "python-multipart>=0.0.9,<1.0", "pypdf>=4.0,<6.0", "python-docx>=1.1,<2.0", "numpy>=1.26,<3", "sentence-transformers>=3.0,<6.0", "rank-bm25>=0.2.2,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
